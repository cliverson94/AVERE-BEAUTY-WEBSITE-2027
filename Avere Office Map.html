<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avere Beauty Offices Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Lato',sans-serif;color:#2B2226;background:#FFF5F5}
#map{position:absolute;inset:0}
.leaflet-tile-pane{filter:grayscale(1) sepia(.35) hue-rotate(300deg) saturate(1.3) brightness(1.04) contrast(.92)}
.leaflet-control-attribution{font-size:10px}
.pin{width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#2B2226;border:3px solid #fff;box-shadow:0 8px 20px rgba(43,34,38,.35);display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s;cursor:pointer}
.pin span{transform:rotate(45deg);color:#FFE3E3;font-family:'Poppins',sans-serif;font-size:20px;line-height:1}
.pin.on{background:#B04A62;transform:rotate(-45deg) scale(1.2)}
.pin.soon{background:#8C7A80}
.you{width:18px;height:18px;border-radius:50%;background:#B04A62;border:3px solid #fff;box-shadow:0 0 0 8px rgba(176,74,98,.25)}
.finder{position:absolute;top:14px;left:14px;right:14px;max-width:420px;z-index:1000;background:#fff;border-radius:18px;padding:10px;display:flex;gap:8px;box-shadow:0 12px 30px rgba(43,34,38,.15)}
.finder input{flex:1;min-width:0;height:48px;border:1px solid #EFC3C7;border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;background:#FFF5F5;color:#2B2226;outline:none}
.finder button{height:48px;padding:0 18px;border:none;border-radius:12px;background:#2B2226;color:#fff;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
.msg{position:absolute;top:84px;left:14px;max-width:420px;z-index:1000;background:#2B2226;color:#FFE3E3;border-radius:14px;padding:10px 14px;font-size:14px;display:none}
.card{position:absolute;left:14px;bottom:28px;z-index:1000;width:min(360px,calc(100% - 28px));background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(43,34,38,.25);transform:translateY(12px);opacity:0;transition:all .3s}
.card.show{transform:none;opacity:1}
.card img{width:100%;height:130px;object-fit:cover;display:block;background:#FFE3E3}
.card .b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.card .t{font-family:'Poppins',sans-serif;font-size:32px;line-height:1}
.card .a{font-size:14px;color:#6E5F64;line-height:1.45}
.card .d{font-size:13px;color:#4A3B40}
.card .row{display:flex;gap:8px;margin-top:8px}
.card a{flex:1;text-align:center;padding:12px 10px;border-radius:999px;font-size:14px;font-weight:700;text-decoration:none}
.card a.p{background:#2B2226;color:#fff}.card a.s{border:1px solid #2B2226;color:#2B2226}
.chip{display:inline-block;background:#FFE3E3;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#8E3A4F;align-self:flex-start}
</style>
</head>
<body>
<div id="map"></div>
<form class="finder" id="finder">
  <input id="town" placeholder="Enter your town or zip" autocomplete="address-level2" list="towns">
  <datalist id="towns"></datalist>
  <button type="submit">Find closest</button>
</form>
<div class="msg" id="msg"></div>
<div class="card" id="card"></div>
<script>
const WX = (id) => `https://static.wixstatic.com/media/${id}/v1/fill/w_720,h_260,al_c,q_80/o.jpg`;
const OFFICES = [
  { id: 'lawrenceville', n: 'L', name: 'Lawrenceville', addr: '3453 Butler Street, Pittsburgh, PA 15201', lat: 40.4666, lng: -79.9602, dev: 'Lasers: MOTUS AZ+ · SmartXide Tetra', img: WX('903d63_24475366948040e78160f8ec6409949a~mv2.jpg'), book: 'https://square.site/book/JJZD0H2BQ0RME/avere-beauty-lawrenceville-pittsburgh-pa', map: 'https://maps.app.goo.gl/9nzKxWPxhcgexSAX8' },
  { id: 'cranberry', n: 'C', name: 'Cranberry', addr: '179 Scharberry Ln, Mars, PA 16046', lat: 40.6958, lng: -80.0772, dev: 'Lasers: Sciton mJOULE BBL', img: 'assets/office-cranberry.jpg', book: '#', map: 'https://maps.app.goo.gl/1dVzPj2E5dEMNkaZ6' },
  { id: 'murrysville', n: 'M', name: 'Murrysville', addr: '5100 Old William Penn Hwy, Export, PA 15632', lat: 40.4312, lng: -79.6405, dev: 'Lasers: EVO Quantum Series · SmartXide Tetra', img: WX('903d63_5a1d874c69244c898c653a743d295eaa~mv2.jpg'), book: 'https://square.site/book/LRK1T17YQYTVG/avere-beauty-murrysville-export-pa', map: 'https://maps.app.goo.gl/VREmjDntVtmiQHMM8' },
  { id: 'foxchapel', n: 'F', name: 'Fox Chapel', addr: '307 Freeport Road, Blawnox, PA 15238', lat: 40.4928, lng: -79.8612, dev: 'Laser treatments coming soon', soon: true, img: 'assets/office-foxchapel.jpg', book: '#', map: 'https://maps.app.goo.gl/EEWexjiBBBwrVH9u7' },
];
const TOWNS = { 'pittsburgh': [40.4406, -79.9959], 'lawrenceville': [40.4666, -79.9602], 'squirrel hill': [40.4338, -79.9236], 'shadyside': [40.4546, -79.9346], 'oakland': [40.4418, -79.9561], 'downtown pittsburgh': [40.4406, -79.9959], 'south side': [40.4280, -79.9770], 'bloomfield': [40.4610, -79.9490], 'highland park': [40.4780, -79.9180], 'mt. lebanon': [40.3551, -80.0495], 'mt lebanon': [40.3551, -80.0495], 'mount lebanon': [40.3551, -80.0495], 'upper st clair': [40.3359, -80.0834], 'upper st. clair': [40.3359, -80.0834], 'bethel park': [40.3276, -80.0395], 'moon': [40.5163, -80.2230], 'moon township': [40.5163, -80.2230], 'coraopolis': [40.5184, -80.1667], 'sewickley': [40.5367, -80.1845], 'wexford': [40.6262, -80.0556], 'cranberry': [40.6848, -80.1073], 'cranberry township': [40.6848, -80.1073], 'mars': [40.6959, -80.0120], 'gibsonia': [40.6298, -79.9695], 'mccandless': [40.5854, -80.0290], 'ross': [40.5234, -80.0228], 'fox chapel': [40.5134, -79.8795], 'blawnox': [40.4928, -79.8612], 'oakmont': [40.5217, -79.8423], 'aspinwall': [40.4912, -79.9048], 'sharpsburg': [40.4948, -79.9259], 'o\'hara': [40.5070, -79.8930], 'harmar': [40.5498, -79.8190], 'natrona heights': [40.6195, -79.7253], 'murrysville': [40.4284, -79.6976], 'export': [40.4178, -79.6231], 'monroeville': [40.4212, -79.7881], 'plum': [40.5003, -79.7495], 'delmont': [40.4131, -79.5706], 'greensburg': [40.3015, -79.5389], 'irwin': [40.3245, -79.7012], 'north huntingdon': [40.3290, -79.7337], 'penn hills': [40.5012, -79.8390], 'wilkinsburg': [40.4417, -79.8820], 'robinson': [40.4570, -80.1370], 'north hills': [40.5480, -80.0180], 'butler': [40.8612, -79.8953], 'zelienople': [40.7945, -80.1392], 'seven fields': [40.6906, -80.0626], 'allison park': [40.5595, -79.9587], 'hampton': [40.5826, -79.9500], 'shaler': [40.5226, -79.9620], 'new kensington': [40.5698, -79.7648], 'lower burrell': [40.5531, -79.7570] };
const ZIPS = { '15201': 'lawrenceville', '15238': 'blawnox', '15632': 'export', '16046': 'mars', '16066': 'cranberry', '15668': 'murrysville', '15217': 'squirrel hill', '15232': 'shadyside', '15213': 'oakland', '15222': 'downtown pittsburgh', '15203': 'south side', '15228': 'mt lebanon', '15241': 'upper st clair', '15102': 'bethel park', '15108': 'moon', '15143': 'sewickley', '15090': 'wexford', '15215': 'aspinwall', '15139': 'oakmont', '15146': 'monroeville', '15239': 'plum', '15601': 'greensburg', '15642': 'irwin', '15235': 'penn hills', '15237': 'mccandless', '15044': 'gibsonia', '15101': 'allison park' };
document.getElementById('towns').innerHTML = Object.keys(TOWNS).map(t => `<option value="${t.replace(/\b\w/g, c => c.toUpperCase())}">`).join('');

const map = L.map('map', { zoomControl: false, scrollWheelZoom: false, attributionControl: true }).setView([40.52, -79.9], 8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 18 }).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);
const bounds = L.latLngBounds(OFFICES.map(o => [o.lat, o.lng])).pad(0.25);
const markers = {};
let active = null, you = null;
OFFICES.forEach(o => {
  const icon = L.divIcon({ className: '', html: `<div class="pin${o.soon ? ' soon' : ''}" id="pin-${o.id}"><span>${o.n}</span></div>`, iconSize: [44, 44], iconAnchor: [22, 44] });
  const m = L.marker([o.lat, o.lng], { icon, title: o.name }).addTo(map);
  m.on('mouseover', () => focus(o.id));
  m.on('click', () => focus(o.id, true));
  markers[o.id] = m;
});
function focus(id, zoom, extra) {
  const o = OFFICES.find(x => x.id === id); if (!o) return;
  document.querySelectorAll('.pin').forEach(p => p.classList.remove('on'));
  const pin = document.getElementById('pin-' + id); if (pin) pin.classList.add('on');
  if (active !== id || zoom) map.flyTo([o.lat, o.lng], zoom ? 15 : 12, { duration: 1.2 });
  active = id;
  const card = document.getElementById('card');
  card.innerHTML = `<img src="${o.img}" alt="${o.name} office"><div class="b">${extra ? `<span class="chip">${extra}</span>` : ''}<span class="t">${o.name}</span><span class="a">${o.addr}</span><span class="d">${o.dev}</span><div class="row"><a class="p" href="${o.book}" target="_top">Book here</a><a class="s" href="${o.map}" target="_blank" rel="noopener">Directions</a></div></div>`;
  card.classList.add('show');
  parent.postMessage({ type: 'avere-office-focused', id }, '*');
}
const km = (a, b) => { const R = 6371, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r; const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
function showMsg(t) { const m = document.getElementById('msg'); m.textContent = t; m.style.display = t ? 'block' : 'none'; }
function nearest(pt, label) {
  const ranked = OFFICES.map(o => ({ o, d: km(pt, [o.lat, o.lng]) })).sort((a, b) => a.d - b.d);
  const best = ranked[0], mi = (best.d * 0.621).toFixed(1);
  if (you) map.removeLayer(you);
  you = L.marker(pt, { icon: L.divIcon({ className: '', html: '<div class="you"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(map);
  showMsg('');
  map.flyToBounds(L.latLngBounds([pt, [best.o.lat, best.o.lng]]).pad(0.6), { duration: 1.2 });
  setTimeout(() => focus(best.o.id, false, `Closest to ${label} · ~${mi} mi`), 1300);
}
document.getElementById('finder').addEventListener('submit', async e => {
  e.preventDefault();
  let q = document.getElementById('town').value.trim().toLowerCase().replace(/,?\s*pa$/, '');
  if (!q) return;
  if (ZIPS[q]) q = ZIPS[q];
  if (TOWNS[q]) return nearest(TOWNS[q], q.replace(/\b\w/g, c => c.toUpperCase()));
  showMsg('Searching…');
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=' + encodeURIComponent(q + ', Pennsylvania'));
    const j = await r.json();
    if (j[0]) return nearest([+j[0].lat, +j[0].lon], q.replace(/\b\w/g, c => c.toUpperCase()));
    showMsg('We couldn’t find that town. Try a nearby town or your zip code.');
  } catch (err) { showMsg('We couldn’t find that town. Try a nearby town or your zip code.'); }
});
window.addEventListener('message', e => { if (e.data && e.data.type === 'avere-focus-office') focus(e.data.id, e.data.zoom !== false); });
setTimeout(() => map.flyToBounds(bounds, { duration: 2.2 }), 400);
</script>
</body>
</html>
