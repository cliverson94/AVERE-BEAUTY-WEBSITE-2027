<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ show }}" hint-placeholder-val="{{ false }}">
  <a href="Avere 11s Day.dc.html" data-cta="event:elevens:banner" data-cta-unit="event:elevens:banner" style="display:flex;align-items:center;justify-content:center;gap:8px 18px;flex-wrap:wrap;background:#B04A62;color:#fff;padding:9px 48px 9px 16px;min-height:44px;font-family:'Lato',sans-serif;font-size:14px;position:relative;text-align:center;text-decoration:none" style-hover="color:#fff;background:#9C3F56">
    <span style="font-weight:700;letter-spacing:.02em">{{ lead }}</span>
    <span style="display:flex;gap:6px;font-family:'Poppins',sans-serif;font-variant-numeric:tabular-nums">
      <sc-for list="{{ units }}" as="u" hint-placeholder-count="4">
        <span style="background:rgba(255,255,255,.16);border-radius:8px;padding:2px 8px;font-size:13px">{{ u.v }}<span style="opacity:.8;font-size:11px;margin-left:2px">{{ u.k }}</span></span>
      </sc-for>
    </span>
    <span style="font-weight:700;text-decoration:underline;text-underline-offset:3px">{{ cta }} →</span>
    <button onClick="{{ dismiss }}" aria-label="Close banner" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:#fff;font-size:18px;cursor:pointer">×</button>
  </a>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;60px&quot;},&quot;showFrom&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:45,&quot;tsType&quot;:&quot;number&quot;,&quot;unit&quot;:&quot;days&quot;},&quot;forceShow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
// Runs every year on its own: shows from `showFrom` days before Nov 11 through the end of Nov 11.
class Component extends DCLogic {
  state = { now: Date.now(), closed: false };
  componentDidMount() {
    try { if (sessionStorage.getItem('av_banner_11_' + new Date().getFullYear()) === '1') this.setState({ closed: true }); } catch (e) {}
    this.t = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const now = new Date(this.state.now), y = now.getFullYear();
    const target = new Date(y, 10, 11, 0, 0, 0), end = new Date(y, 10, 12, 0, 0, 0);
    const from = new Date(target.getTime() - (this.props.showFrom ?? 45) * 864e5);
    const live = now >= target && now < end;
    const show = !this.state.closed && (this.props.forceShow || (now >= from && now < end));
    let ms = Math.max(0, target - now);
    if (this.props.forceShow && now >= end) ms = new Date(y + 1, 10, 11) - now;
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
    return {
      show,
      lead: live ? '11’s Day is here' : `11’s Day begins in ${d} day${d === 1 ? '' : 's'}`,
      units: live ? [] : [[d, 'd'], [h, 'h'], [m, 'm'], [s, 's']].map(([v, k]) => ({ v: String(v).padStart(2, '0'), k })),
      cta: live ? 'Shop the deals' : 'Reserve your space now',
      dismiss: e => { e.preventDefault(); e.stopPropagation(); try { sessionStorage.setItem('av_banner_11_' + y, '1'); } catch (x) {} this.setState({ closed: true }); },
    };
  }
}
</script>
</body>
</html>
