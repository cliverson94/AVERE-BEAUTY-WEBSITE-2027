<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Lato',sans-serif}*{box-sizing:border-box}a{color:inherit;text-decoration:none}a:hover{color:#B04A62}</style>
</helmet>
<section data-screen-label="Trust badges" style="{{ wrap }}">
  <div style="max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:28px;align-items:center">
    <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ true }}"><span style="{{ eyebrow }}">{{ title }}</span></sc-if>
    <div style="width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:clamp(16px,3vw,32px);justify-items:center">
      <sc-for list="{{ badges }}" as="b" hint-placeholder-count="6">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:180px">
          <div style="{{ b.seal }}">
            <div style="{{ b.ring }}"></div>
            <span style="{{ b.kicker }}">{{ b.kick }}</span>
            <span style="{{ b.big }}">{{ b.value }}</span>
            <span style="{{ b.stars }}">★ ★ ★</span>
          </div>
          <span style="{{ b.label }}">{{ b.text }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;360px&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Recognized for care and results&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#fff&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// Edit badge wording here. Confirm each accolade before launch.
const BADGES = [
  { kick: 'Allergan', value: 'Top 1%', text: 'Top 1% Allergan Aesthetics provider' },
  { kick: 'Allergan', value: 'Platinum', text: 'Allergan Platinum partner' },
  { kick: 'Founder', value: '20,000+', text: 'Patients in the brand Alyssa Luciano, RN built' },
  { kick: 'Pittsburgh', value: '4', text: 'Offices across Pittsburgh' },
  { kick: 'Medical', value: 'NP + RN', text: 'Licensed nurse injectors' },
  { kick: 'Safety', value: 'FDA', text: 'FDA-approved injectables and FDA-cleared devices' }
];
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.variant ?? 'light') === 'dark';
    const ink = dark ? '#fff' : '#2B2226', sub = dark ? '#E8CDD2' : '#6E5F64', accent = dark ? '#EFC3C7' : '#B04A62';
    const title = this.props.title ?? 'Recognized for care and results';
    return {
      hasTitle: !!title, title,
      wrap: { background: dark ? '#2B2226' : (this.props.bg || '#fff'), padding: 'clamp(40px,6vw,72px) clamp(20px,4vw,32px)', borderTop: dark ? 'none' : '1px solid #F4DADC', borderBottom: dark ? 'none' : '1px solid #F4DADC' },
      eyebrow: { fontSize: 13, letterSpacing: '.18em', textTransform: 'uppercase', fontWeight: 700, color: accent },
      badges: BADGES.map((b, i) => ({ ...b,
        seal: { position: 'relative', width: 128, height: 128, borderRadius: '50%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2, background: i < 2 ? (dark ? '#B04A62' : '#2B2226') : (dark ? 'rgba(255,255,255,.06)' : '#FFF5F5'), color: i < 2 ? '#fff' : ink },
        ring: { position: 'absolute', inset: 6, borderRadius: '50%', border: '1px dashed ' + (i < 2 ? 'rgba(255,255,255,.45)' : accent), opacity: .8 },
        kicker: { fontSize: 10, letterSpacing: '.18em', textTransform: 'uppercase', fontWeight: 700, opacity: .85 },
        big: { fontFamily: "'Poppins',sans-serif", fontSize: b.value.length > 6 ? 19 : 26, lineHeight: 1.05, letterSpacing: '-.02em' },
        stars: { fontSize: 8, letterSpacing: '.2em', color: i < 2 ? '#EFC3C7' : accent },
        label: { fontSize: 14, lineHeight: 1.4, color: sub, textWrap: 'balance' } }))
    };
  }
}
</script>
</body>
</html>
