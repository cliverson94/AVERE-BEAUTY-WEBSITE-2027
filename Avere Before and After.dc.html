<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Before &amp; After Gallery | Avere Beauty Pittsburgh</title>
<meta name="description" content="Real Avere Beauty patient results: Botox, lip filler, dermal filler, lasers, tattoo removal, chemical peels, HydraFacial, PDO threads and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>body{margin:0;font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased;color:#2B2226;background:#fff}*{box-sizing:border-box}a{color:inherit;text-decoration:none}a:hover{color:#B04A62}</style>
</helmet>
<div style="min-height:100vh;background:#fff">
  <dc-import name="Avere Nav" active="resources" style="position:sticky;top:0;z-index:30;display:block" hint-size="100%,110px"></dc-import>
  <section data-screen-label="Hero" style="background:#FFF5F5">
    <div style="max-width:1320px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(20px,4vw,32px) clamp(32px,4vw,48px);display:flex;flex-direction:column;gap:20px">
      <span style="font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#B04A62;font-weight:700">Before &amp; After</span>
      <h1 style="font-family:'Poppins',sans-serif;font-weight:400;font-size:clamp(38px,5.4vw,72px);line-height:1.04;letter-spacing:-.03em;margin:0;max-width:900px;text-wrap:balance">Real patients, real results</h1>
      <p style="margin:0;font-size:17px;line-height:1.7;color:#4A3B40;max-width:620px">Every photo is an Avere patient, shared with permission and unretouched. Results vary from person to person.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="10">
          <button onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
        </sc-for>
      </div>
    </div>
  </section>
  <section data-screen-label="Gallery" style="max-width:1320px;margin:0 auto;padding:clamp(36px,5vw,64px) clamp(20px,4vw,32px) clamp(56px,8vw,96px);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px">
    <sc-for list="{{ items }}" as="r" hint-placeholder-count="9">
      <figure style="margin:0;border:1px solid #F4DADC;border-radius:28px;overflow:hidden;display:flex;flex-direction:column">
        <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px;background:#F4DADC">
          <div style="position:relative;min-width:0;aspect-ratio:3/4;overflow:hidden;background:#FFF5F5"><image-slot id="{{ r.b }}" shape="rect" placeholder="Before"></image-slot><span style="position:absolute;left:10px;top:10px;background:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;pointer-events:none">BEFORE</span></div>
          <div style="position:relative;min-width:0;aspect-ratio:3/4;overflow:hidden;background:#FFF5F5"><image-slot id="{{ r.a }}" shape="rect" placeholder="After"></image-slot><span style="position:absolute;left:10px;top:10px;background:#2B2226;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;pointer-events:none">AFTER</span></div>
        </div>
        <figcaption style="padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px">
          <span style="display:flex;flex-direction:column;gap:2px"><span style="font-family:'Poppins',sans-serif;font-size:18px">{{ r.t }}</span><span style="font-size:14px;color:#6E5F64">{{ r.d }}</span></span>
          <a href="{{ r.href }}" style="font-size:14px;font-weight:700;color:#B04A62;white-space:nowrap">Learn more →</a>
        </figcaption>
      </figure>
    </sc-for>
  </section>
  <section data-screen-label="CTA" style="padding:0 clamp(20px,4vw,32px) clamp(56px,8vw,96px)">
    <div style="max-width:1320px;margin:0 auto;background:#2B2226;color:#fff;border-radius:32px;padding:clamp(40px,6vw,72px);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center">
      <h2 style="font-family:'Poppins',sans-serif;font-weight:400;font-size:clamp(28px,3.4vw,44px);line-height:1.1;margin:0">See what’s possible for you</h2>
      <a href="Avere Free Consultation.dc.html" style="background:#FFE3E3;color:#2B2226;min-height:52px;padding:0 30px;border-radius:999px;display:flex;align-items:center;font-size:15px;font-weight:700" style-hover="background:#fff;color:#2B2226">Book a free consult</a>
    </div>
  </section>
  <dc-import name="Avere Footer" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const CATS = [
  ['botox', 'Botox', 'Avere Injectables.dc.html', ['Forehead lines', 'Crow’s feet', 'Lip flip']],
  ['lips', 'Lip filler', 'Lip Filler.dc.html', ['Natural lip', 'Lip shape', 'Lip volume']],
  ['filler', 'Dermal filler', 'Avere Dermal Fillers.dc.html', ['Cheeks', 'Chin', 'Jawline']],
  ['sculptra', 'Sculptra', 'Avere Sculptra.dc.html', ['Temples', 'Mid-face']],
  ['threads', 'PDO threads', 'Avere PDO Threads.dc.html', ['Jawline', 'Brow lift']],
  ['laser', 'Lasers', 'Avere Lasers.dc.html', ['Sun damage', 'Texture']],
  ['tattoo', 'Tattoo removal', 'Avere Tattoo Removal.dc.html', ['Forearm', 'Fine line']],
  ['peels', 'Chemical peels', 'Avere Chemical Peels.dc.html', ['Melasma', 'Acne']],
  ['facials', 'HydraFacial', 'Avere HydraFacial.dc.html', ['Glow', 'Congestion']],
  ['kybella', 'Kybella', 'Avere Kybella.dc.html', ['Under-chin']],
];
const ALL = CATS.flatMap(([k, label, href, list]) => list.map((t, i) => ({ k, t, d: label, href, b: `ba-${k}-${i + 1}-before`, a: `ba-${k}-${i + 1}-after` })));
class Component extends DCLogic {
  state = { f: 'all' };
  renderVals() {
    const f = this.state.f;
    const chip = on => ({ minHeight: 44, padding: '0 18px', borderRadius: 999, border: '1px solid ' + (on ? '#2B2226' : '#EFC3C7'), background: on ? '#2B2226' : '#fff', color: on ? '#fff' : '#2B2226', fontSize: 14, fontWeight: 700, fontFamily: 'Lato,sans-serif', cursor: 'pointer' });
    const chips = [['all', 'All']].concat(CATS.map(c => [c[0], c[1]])).map(([k, label]) => ({ label, style: chip(f === k), pick: () => this.setState({ f: k }) }));
    return { chips, items: f === 'all' ? ALL : ALL.filter(x => x.k === f) };
  }
}
</script>
</body>
</html>
