<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./analytics.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased;color:#2B2226}*{box-sizing:border-box}a{color:inherit;text-decoration:none}a:hover{color:#B04A62}</style>
</helmet>
<div id="lead-form" style="background:#fff;border:1px solid #F4DADC;border-radius:28px;padding:clamp(22px,4vw,36px);box-shadow:0 24px 60px -32px rgba(43,34,38,.35);font-family:'Lato',sans-serif;color:#2B2226;width:100%">
  <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
    <form onSubmit="{{ submit }}" name="{{ cfg.id }}" data-name="{{ cfg.id }}" style="display:flex;flex-direction:column;gap:12px;margin:0">
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:6px">
        <h2 style="font-family:'Poppins',sans-serif;font-weight:500;font-size:clamp(22px,2.4vw,26px);line-height:1.2;margin:0">{{ cfg.title }}</h2>
        <p style="margin:0;font-size:15px;line-height:1.55;color:#6E5F64">{{ cfg.sub }}</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px">
        <input name="first_name" value="{{ v.first_name }}" onChange="{{ set.first_name }}" placeholder="First name" autocomplete="given-name" required="{{ true }}" style="height:54px;border:1px solid #EFC3C7;border-radius:14px;padding:0 16px;font-size:16px;color:#2B2226;background:#FFF5F5;outline:none;font-family:inherit;width:100%" style-focus="border-color:#B04A62;background:#fff">
        <input name="last_name" value="{{ v.last_name }}" onChange="{{ set.last_name }}" placeholder="Last name" autocomplete="family-name" style="height:54px;border:1px solid #EFC3C7;border-radius:14px;padding:0 16px;font-size:16px;color:#2B2226;background:#FFF5F5;outline:none;font-family:inherit;width:100%" style-focus="border-color:#B04A62;background:#fff">
      </div>
      <input name="phone" value="{{ v.phone }}" onChange="{{ set.phone }}" placeholder="Mobile number" type="tel" inputmode="tel" autocomplete="tel" required="{{ true }}" style="height:54px;border:1px solid #EFC3C7;border-radius:14px;padding:0 16px;font-size:16px;color:#2B2226;background:#FFF5F5;outline:none;font-family:inherit;width:100%" style-focus="border-color:#B04A62;background:#fff">
      <input name="email" value="{{ v.email }}" onChange="{{ set.email }}" placeholder="Email" type="email" inputmode="email" autocomplete="email" required="{{ true }}" style="height:54px;border:1px solid #EFC3C7;border-radius:14px;padding:0 16px;font-size:16px;color:#2B2226;background:#FFF5F5;outline:none;font-family:inherit;width:100%" style-focus="border-color:#B04A62;background:#fff">
      <sc-if value="{{ cfg.loc }}" hint-placeholder-val="{{ true }}">
        <select name="location" value="{{ v.location }}" onChange="{{ set.location }}" style="height:54px;border:1px solid #EFC3C7;border-radius:14px;padding:0 14px;font-size:16px;color:#2B2226;background:#FFF5F5;outline:none;font-family:inherit;width:100%">
          <option value="">Preferred location</option>
          <option value="Lawrenceville">Lawrenceville</option>
          <option value="Cranberry">Cranberry</option>
          <option value="Murrysville">Murrysville</option>
          <option value="Fox Chapel">Fox Chapel</option>
          <option value="Any">Any location</option>
        </select>
      </sc-if>
      <sc-for list="{{ fields }}" as="f" hint-placeholder-count="0">
        <div style="display:flex;flex-direction:column;gap:6px">
          <sc-if value="{{ f.hasLabel }}" hint-placeholder-val="{{ false }}">
            <label style="font-size:13px;font-weight:700;color:#6E5F64;padding-left:4px">{{ f.label }}</label>
          </sc-if>
          <sc-if value="{{ f.isSelect }}" hint-placeholder-val="{{ false }}">
            <select name="{{ f.key }}" value="{{ f.value }}" onChange="{{ f.set }}" style="height:54px;border:1px solid #EFC3C7;border-radius:14px;padding:0 14px;font-size:16px;color:#2B2226;background:#FFF5F5;outline:none;font-family:inherit;width:100%">
              <option value="">{{ f.ph }}</option>
              <sc-for list="{{ f.options }}" as="o" hint-placeholder-count="0">
                <option value="{{ o }}">{{ o }}</option>
              </sc-for>
            </select>
          </sc-if>
          <sc-if value="{{ f.isInput }}" hint-placeholder-val="{{ false }}">
            <input name="{{ f.key }}" type="{{ f.type }}" value="{{ f.value }}" onChange="{{ f.set }}" placeholder="{{ f.ph }}" style="height:54px;border:1px solid #EFC3C7;border-radius:14px;padding:0 16px;font-size:16px;color:#2B2226;background:#FFF5F5;outline:none;font-family:inherit;width:100%" style-focus="border-color:#B04A62;background:#fff">
          </sc-if>
          <sc-if value="{{ f.isArea }}" hint-placeholder-val="{{ false }}">
            <textarea name="{{ f.key }}" value="{{ f.value }}" onChange="{{ f.set }}" placeholder="{{ f.ph }}" rows="3" style="border:1px solid #EFC3C7;border-radius:14px;padding:14px 16px;font-size:16px;color:#2B2226;background:#FFF5F5;outline:none;font-family:inherit;width:100%;resize:vertical" style-focus="border-color:#B04A62;background:#fff"></textarea>
          </sc-if>
        </div>
      </sc-for>
      <sc-for list="{{ hidden }}" as="h" hint-placeholder-count="0">
        <input type="hidden" name="{{ h.k }}" value="{{ h.v }}">
      </sc-for>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:#6E5F64;cursor:pointer;margin-top:4px">
        <input type="checkbox" name="sms_consent" checked="{{ v.sms_consent }}" onChange="{{ set.sms_consent }}" style="width:20px;height:20px;margin:1px 0 0;accent-color:#B04A62;flex-shrink:0">
        <span>Text me about this request. Msg &amp; data rates may apply. Msg frequency varies. Reply STOP to opt out, HELP for help.</span>
      </label>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:#6E5F64;cursor:pointer">
        <input type="checkbox" name="marketing_consent" checked="{{ v.marketing_consent }}" onChange="{{ set.marketing_consent }}" style="width:20px;height:20px;margin:1px 0 0;accent-color:#B04A62;flex-shrink:0">
        <span>Send me offers and news by email and text.</span>
      </label>
      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <p style="margin:0;font-size:14px;color:#A3324B;font-weight:700">{{ error }}</p>
      </sc-if>
      <button type="submit" style="min-height:56px;border-radius:999px;border:none;cursor:pointer;font-family:'Lato',sans-serif;font-size:17px;font-weight:700;background:#2B2226;color:#fff;margin-top:4px" style-hover="background:#B04A62">{{ cfg.button }}</button>
      <p style="margin:0;font-size:12px;line-height:1.5;color:#6E5F64;text-align:center">We’ll reach out {{ speed }}. Please don’t include medical history. <a href="/policies#privacy" style="text-decoration:underline">Privacy</a></p>
    </form>
  </sc-if>
  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:8px 0">
      <span style="width:52px;height:52px;border-radius:50%;background:#FFE3E3;color:#B04A62;display:flex;align-items:center;justify-content:center;font-size:24px">✓</span>
      <h2 style="font-family:'Poppins',sans-serif;font-weight:500;font-size:clamp(22px,2.4vw,26px);line-height:1.2;margin:0">Thanks, {{ firstName }}. We got it.</h2>
      <p style="margin:0;font-size:16px;line-height:1.6;color:#6E5F64;text-wrap:pretty">{{ cfg.done }} A confirmation is on its way to {{ v.email }}{{ smsNote }}.</p>
      <sc-if value="{{ cfg.book }}" hint-placeholder-val="{{ true }}">
        <a href="{{ bookHref }}" style="background:#2B2226;color:#fff;min-height:52px;padding:0 26px;border-radius:999px;display:flex;align-items:center;font-size:16px;font-weight:700" style-hover="background:#B04A62;color:#fff">Book now instead</a>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;460px&quot;,&quot;height&quot;:&quot;820px&quot;},&quot;form&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;newpatient&quot;,&quot;consult&quot;,&quot;bridal&quot;,&quot;vip&quot;,&quot;refer&quot;,&quot;lhr&quot;,&quot;training&quot;,&quot;weightloss&quot;],&quot;default&quot;:&quot;consult&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;the same business day&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;webhook&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TREATMENTS = ['Botox / Neurotoxins', 'Lip Filler', 'Dermal Filler', 'Laser Hair Removal', 'Skin Resurfacing / Lasers', 'HydraFacial / Facials', 'PDO Threads', 'Microneedling', 'Weight Loss', 'Not sure yet'];
const FORMS = {
  newpatient: { title: 'Claim 10% off your first treatment', sub: 'New clients only. We’ll text your offer and help you book.', button: 'Claim my 10%', loc: true, book: true, done: 'Your 10% offer is saved to your number. We’ll text you to pick a time.',
    fields: [{ key: 'interest', type: 'select', ph: 'What are you interested in?', options: TREATMENTS }] },
  consult: { title: 'Request a free consultation', sub: 'Tell us what you’re curious about. A team member will reach out to schedule.', button: 'Request my consult', loc: true, book: true, done: 'A team member will reach out to schedule your consultation.',
    fields: [{ key: 'interest', type: 'select', ph: 'What are you interested in?', options: TREATMENTS }, { key: 'best_time', type: 'select', ph: 'Best time to reach you', options: ['Morning', 'Afternoon', 'Evening'] }, { key: 'question', type: 'textarea', ph: 'Questions for us (optional)' }] },
  bridal: { title: 'Plan your bridal glow', sub: 'We’ll build a timeline back from your date.', button: 'Start my plan', loc: true, book: false, done: 'We’ll reach out to plan your timeline.',
    fields: [{ key: 'event_date', type: 'date', label: 'Wedding date' }, { key: 'party_size', type: 'select', ph: 'Who’s coming?', options: ['Just me', '2–4 people', '5 or more'] }, { key: 'interest', type: 'select', ph: 'Main interest', options: ['Botox', 'Facials', 'Lip filler', 'Lasers', 'A full plan'] }] },
  vip: { title: 'Join the VIP waitlist', sub: 'Membership spots open in small groups. Be first to hear.', button: 'Join the waitlist', loc: true, book: false, done: 'You’re on the list. We’ll let you know as soon as a spot opens.',
    fields: [{ key: 'interest', type: 'select', ph: 'What do you get most often?', options: ['Botox / Neurotoxins', 'Filler', 'Facials', 'Lasers', 'A mix'] }, { key: 'visit_frequency', type: 'select', ph: 'How often do you visit?', options: ['Monthly', 'Every 2–3 months', 'A few times a year', 'I’m new'] }] },
  refer: { title: 'Refer a friend', sub: 'You both get a reward after their first visit.', button: 'Send my referral', loc: false, book: false, done: 'We’ll email your friend an invite. You’ll get your reward after their first visit.',
    fields: [{ key: 'friend_first_name', type: 'text', ph: 'Friend’s first name' }, { key: 'friend_email', type: 'email', ph: 'Friend’s email' }] },
  lhr: { title: 'Get your laser hair removal quote', sub: 'Pick your areas and we’ll send pricing and package options.', button: 'Get my quote', loc: true, book: true, done: 'We’ll send your quote today.',
    fields: [{ key: 'interest', type: 'select', ph: 'Main area', options: ['Underarms', 'Bikini / Brazilian', 'Full legs', 'Lower legs', 'Face / upper lip', 'Back', 'Multiple areas'] }, { key: 'prior_lhr', type: 'select', ph: 'Had laser hair removal before?', options: ['No, first time', 'Yes, elsewhere', 'Yes, at Avere'] }] },
  training: { title: 'Apply for injector training', sub: 'For licensed medical professionals.', button: 'Submit application', loc: false, book: false, done: 'Our training team will review your application and reach out.',
    fields: [{ key: 'credential', type: 'select', ph: 'Your credential', options: ['RN', 'NP', 'PA', 'MD / DO', 'DDS', 'Other'] }, { key: 'license_state', type: 'text', ph: 'License state' }, { key: 'experience', type: 'select', ph: 'Injecting experience', options: ['Brand new', 'Under 1 year', '1–3 years', '3+ years'] }, { key: 'interest', type: 'select', ph: 'Course interest', options: ['Foundations: tox & filler', 'Advanced filler', 'PDO threads', 'Shadowing Program', 'Not sure'] }] },
  weightloss: { title: 'Request a weight loss consult', sub: 'Our NP will reach out to schedule your consultation.', button: 'Request my consult', loc: true, book: true, done: 'Our weight loss team will reach out to schedule.',
    fields: [{ key: 'best_time', type: 'select', ph: 'Best time to reach you', options: ['Morning', 'Afternoon', 'Evening'] }] },
};
const BOOK = 'https://square.site/book/JJZD0H2BQ0RME/avere-beauty-lawrenceville-pittsburgh-pa';
const TRACK = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid', 'fbclid'];
class Component extends DCLogic {
  state = { v: { sms_consent: false, marketing_consent: false }, sent: false, error: '', track: {} };
  componentDidMount() {
    const q = new URLSearchParams(location.search); const now = {};
    TRACK.forEach(k => { if (q.get(k)) now[k] = q.get(k); });
    let first = {}; try { first = JSON.parse(localStorage.getItem('avere_first_touch') || '{}'); } catch (e) {}
    if (Object.keys(now).length && !Object.keys(first).length) { first = { ...now, landing: location.pathname }; try { localStorage.setItem('avere_first_touch', JSON.stringify(first)); } catch (e) {} }
    this.setState({ track: { ...now, first_touch: JSON.stringify(first), page: location.pathname, referrer: document.referrer } });
  }
  setter(k) { return e => { const t = e.target; const val = t.type === 'checkbox' ? t.checked : t.value; this.setState(s => ({ v: { ...s.v, [k]: val }, error: '' })); }; }
  submit(e) {
    e.preventDefault();
    const { v, track } = this.state;
    if (!(v.first_name || '').trim()) return this.setState({ error: 'Please add your first name.' });
    if ((v.phone || '').replace(/\D/g, '').length < 10) return this.setState({ error: 'Please add a 10-digit mobile number.' });
    if (!/^\S+@\S+\.\S+$/.test(v.email || '')) return this.setState({ error: 'Please add a valid email.' });
    const payload = { form_id: this.cfg().id, submitted_at: new Date().toISOString(), ...v, ...track };
    const hook = this.props.webhook || window.AVERE_LEAD_WEBHOOK;
    if (hook) fetch(hook, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).catch(() => {});
    else console.info('[Avere lead]', payload);
    this.setState({ sent: true });
  }
  cfg() { const id = this.props.form || 'consult'; return { id, ...(FORMS[id] || FORMS.consult) }; }
  renderVals() {
    const cfg = this.cfg(); const { v, sent, error, track } = this.state;
    const set = {}; ['first_name', 'last_name', 'phone', 'email', 'location', 'sms_consent', 'marketing_consent'].forEach(k => set[k] = this.setter(k));
    return {
      cfg, v, set, sent, notSent: !sent, error, hasError: !!error,
      speed: this.props.speed ?? 'the same business day',
      submit: e => this.submit(e),
      fields: cfg.fields.map(f => ({ ...f, ph: f.ph || '', hasLabel: !!f.label, isSelect: f.type === 'select', isArea: f.type === 'textarea', isInput: !['select', 'textarea'].includes(f.type), value: v[f.key] || '', set: this.setter(f.key), options: f.options || [] })),
      hidden: [['form_id', cfg.id], ...TRACK.map(k => [k, track[k] || '']), ['first_touch', track.first_touch || ''], ['page', track.page || ''], ['referrer', track.referrer || '']].map(([k, vv]) => ({ k, v: vv })),
      firstName: (v.first_name || '').trim() || 'friend',
      smsNote: v.sms_consent ? ' and by text to ' + v.phone : '',
      bookHref: BOOK,
    };
  }
}
</script>
</body>
</html>
