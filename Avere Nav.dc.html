<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased;color:#2B2226}
a{color:#2B2226;text-decoration:none}a:hover{color:#B04A62}
*{box-sizing:border-box}
</style>
</helmet>
<div onMouseLeave="{{ closeAll }}" style="position:relative;font-family:'Lato',sans-serif;color:#2B2226">
  <div style="background:#2B2226;color:#FFE3E3;font-size:13px">
    <div style="max-width:1320px;margin:0 auto;padding:9px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>{{ promoText }}</span><a href="https://square.site/book/JJZD0H2BQ0RME/avere-beauty-lawrenceville-pittsburgh-pa" style="color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px" style-hover="color:#FFE3E3">Book a consultation</a></span>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <span style="display:flex;gap:24px;flex-shrink:0"><a href="https://squareup.com/gift/8CPGZKSHK7T66/order" style="color:#FFE3E3" style-hover="color:#fff">Gift Cards</a><a href="tel:4129527592" style="color:#FFE3E3" style-hover="color:#fff">412-952-7592</a></span>
      </sc-if>
    </div>
  </div>
  <div style="background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid #F4DADC">
    <div style="max-width:1320px;margin:0 auto;padding:{{ barPad }};display:flex;align-items:center;gap:12px;height:{{ barH }}">
      <a href="/" style="flex-shrink:0"><img src="assets/avere-logo-black.png" alt="Avere Beauty" style="height:{{ logoH }};display:block"></a>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
        <nav style="flex:1;display:flex;justify-content:center;gap:4px">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
            <button onMouseEnter="{{ it.open }}" onClick="{{ it.toggle }}" style="{{ it.style }}">{{ it.label }}<span style="font-size:10px;color:#B04A62">{{ it.caret }}</span></button>
          </sc-for>
        </nav>
        <a href="https://square.site/book/JJZD0H2BQ0RME/avere-beauty-lawrenceville-pittsburgh-pa" style="background:#2B2226;color:#fff;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0" style-hover="background:#B04A62;color:#fff">Book now</a>
      </sc-if>
      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <span style="flex:1"></span>
        <a href="https://square.site/book/JJZD0H2BQ0RME/avere-beauty-lawrenceville-pittsburgh-pa" style="background:#2B2226;color:#fff;height:44px;padding:0 20px;display:flex;align-items:center;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap" style-hover="background:#B04A62;color:#fff">Book</a>
        <button onClick="{{ toggleSheet }}" aria-label="{{ sheetLabel }}" aria-expanded="{{ sheet }}" style="height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;border-radius:999px;border:1px solid #EFC3C7;background:#fff;cursor:pointer;font-size:15px;font-weight:700;color:#2B2226;font-family:'Lato',sans-serif"><span style="font-size:16px;line-height:1">{{ sheetIcon }}</span>{{ sheetWord }}</button>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{ hasPanel }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid #F4DADC;box-shadow:0 30px 60px rgba(43,34,38,.10)">
      <div style="max-width:1320px;margin:0 auto;padding:32px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:48px">
        <a href="{{ panel.href }}" style="display:flex;flex-direction:column;gap:12px" style-hover="color:#2B2226">
          <img src="{{ panel.img }}" alt="{{ panel.title }}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:24px;display:block;background:#FFE3E3">
          <span style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#B04A62">{{ panel.eyebrow }}</span>
          <span style="font-family:'Poppins',sans-serif;font-size:24px;line-height:1.1;letter-spacing:-.02em">{{ panel.title }}</span>
        </a>
        <div style="display:flex;flex-direction:column;justify-content:space-between;gap:24px">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:32px">
            <sc-for list="{{ panel.cols }}" as="c" hint-placeholder-count="2">
              <div style="display:flex;flex-direction:column;gap:12px">
                <span style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6E5F64;padding-bottom:6px;border-bottom:1px solid #F4DADC">{{ c.h }}</span>
                <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="4">
                  <a href="{{ l.href }}" style="font-size:16px;line-height:1.3">{{ l.t }}</a>
                </sc-for>
              </div>
            </sc-for>
          </div>
          <a href="{{ panel.allHref }}" style="align-self:flex-start;font-size:14px;font-weight:600;border-bottom:1px solid #2B2226;padding-bottom:2px">{{ panel.all }} →</a>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:0;right:0;bottom:0;top:{{ sheetTop }};z-index:1000;background:#fff;display:flex;flex-direction:column">
      <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 24px">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
          <div style="border-bottom:1px solid #F4DADC">
            <button onClick="{{ it.toggle }}" aria-expanded="{{ it.isOpen }}" style="width:100%;min-height:60px;display:flex;justify-content:space-between;align-items:center;padding:0;background:none;border:none;cursor:pointer;font-family:'Poppins',sans-serif;font-weight:500;font-size:20px;color:#2B2226;text-align:left;letter-spacing:-.02em">{{ it.label }}<span style="width:32px;height:32px;border-radius:50%;background:#FFE3E3;display:flex;align-items:center;justify-content:center;font-family:'Lato',sans-serif;font-size:18px;color:#2B2226">{{ it.plus }}</span></button>
            <sc-if value="{{ it.isOpen }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;flex-direction:column;gap:16px;padding:0 0 20px">
                <sc-for list="{{ it.cols }}" as="c" hint-placeholder-count="2">
                  <div style="display:flex;flex-direction:column">
                    <span style="font-size:13px;font-weight:700;color:#8E3A4F;padding-bottom:4px">{{ c.h }}</span>
                    <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="4">
                      <a href="{{ l.href }}" style="min-height:44px;display:flex;align-items:center;justify-content:space-between;font-size:17px;color:#2B2226;border-bottom:1px solid #FBEFF0">{{ l.t }}<span style="color:#C9AEB5;font-size:15px">›</span></a>
                    </sc-for>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <a href="https://squareup.com/gift/8CPGZKSHK7T66/order" style="min-height:60px;display:flex;align-items:center;font-family:'Poppins',sans-serif;font-weight:500;font-size:20px;letter-spacing:-.02em;border-bottom:1px solid #F4DADC">Gift Cards</a>
      </div>
      <div style="border-top:1px solid #F4DADC;background:#FFF5F5;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px">
        <a href="tel:4129527592" style="height:52px;border-radius:999px;border:1px solid #EFC3C7;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700">Call</a>
        <a href="sms:4129527592" style="height:52px;border-radius:999px;border:1px solid #EFC3C7;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700">Text</a>
        <a href="https://square.site/book/JJZD0H2BQ0RME/avere-beauty-lawrenceville-pittsburgh-pa" style="height:52px;border-radius:999px;background:#2B2226;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700" style-hover="background:#B04A62;color:#fff">Book now</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1400px&quot;,&quot;height&quot;:&quot;620px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;promos&quot;,&quot;inject&quot;,&quot;lasers&quot;,&quot;esth&quot;,&quot;resources&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;startOpen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;promos&quot;,&quot;inject&quot;,&quot;lasers&quot;,&quot;esth&quot;,&quot;resources&quot;],&quot;default&quot;:&quot;inject&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const WX = (id, w = 600, h = 450) => `https://static.wixstatic.com/media/${id}/v1/fill/w_${w},h_${h},al_c,q_85/img.jpg`;
const TEAM = '/team', TOX = '/botox', LZ = '/laser-treatments';
const L = (t, href = '#') => ({ t, href });
const MENU = [
  { k: 'about', label: 'About', img: WX('903d63_2ea0066f110849b9b60913b8a517e53a~mv2.png'), eyebrow: 'The practice', title: 'Meet the Team', href: TEAM, all: 'About Avere', allHref: TEAM,
    cols: [{ h: 'The practice', links: [L('Our Story', '/our-story'), L('Meet the Team', TEAM), L('Tour the Spa', '/tour-the-spa')] }, { h: 'Connect', links: [L('Locations', '/locations'), L('Careers', TEAM + '#join'), L('Contact', '/contact')] }] },
  { k: 'promos', label: 'Promos', img: WX('903d63_24475366948040e78160f8ec6409949a~mv2.jpg'), eyebrow: 'Limited time', title: 'This Month’s Promo', href: '/claim-the-promo', all: 'All promos', allHref: '/promos',
    cols: [{ h: 'Offers', links: [L('New Patient · 10% Off', '/new-patient-offer'), L('Tox Tuesdays', '/tox-tuesdays'), L('Refer a Friend', '/refer-a-friend'), L('Gift Cards', 'https://squareup.com/gift/8CPGZKSHK7T66/order')] }, { h: 'Programs', links: [L('VIP Membership', '/membership'), L('Bridal Experience', '/bridal-experience')] }] },
  { k: 'inject', label: 'Injectables', img: WX('903d63_2eec0fc59b284e5797e5e3b1bda187a2~mv2.jpg'), eyebrow: 'Most requested', title: 'Botox & Neurotoxins', href: TOX, all: 'All injectables', allHref: '/our-services',
    cols: [{ h: 'Neurotoxins', links: [L('Botox', TOX), L('Dysport', TOX), L('Xeomin', TOX), L('Jeuveau', TOX), L('Daxxify', TOX)] }, { h: 'Fillers & lifting', links: [L('Dermal Fillers', '/dermal-fillers'), L('Lip Filler', '/lip-filler'), L('RHA Filler', '/rha'), L('Sculptra', '/sculptra'), L('PDO Threads', '/pdo-threads'), L('Kybella', '/kybella')] }, { h: 'Wellness', links: [L('Weight Management', '/weight-loss'), L('IV Therapy', '/iv-therapy')] }] },
  { k: 'lasers', label: 'Lasers', img: WX('903d63_5a1d874c69244c898c653a743d295eaa~mv2.jpg'), eyebrow: 'Featured', title: 'Find your laser', href: LZ + '#finder', all: 'All laser treatments', allHref: LZ,
    cols: [{ h: 'Treatments', links: [L('Laser Hair Removal', '/laser-hair-removal'), L('Tattoo Removal', LZ + '#tattoo-removal'), L('Skin Resurfacing', LZ + '#coolpeel'), L('IPL Photofacial', LZ + '#ipl'), L('Pigment & Veins', LZ + '#pigmentation')] }, { h: 'Devices', links: [L('SmartXide Tetra', LZ + '#technology'), L('MOTUS AZ+', LZ + '#technology'), L('EVO Quantum', LZ + '#technology'), L('DEKA Toro', LZ + '#technology'), L('Sciton mJOULE BBL', LZ + '#technology')] }] },
  { k: 'esth', label: 'Esthetics', img: WX('903d63_9d021e833968439ea117454c700a369a~mv2.jpg'), eyebrow: 'Signature', title: 'HydraFacial', href: '/hydrafacial', all: 'All esthetics', allHref: '/esthetics',
    cols: [{ h: 'Facials', links: [L('Signature Facial', '/signature-facial'), L('HydraFacial', '/hydrafacial'), L('Express Facial', '/express-facial'), L('Back Facial', '/back-facial')] }, { h: 'Skin health', links: [L('Dermaplaning', '/dermaplaning'), L('Chemical Peels', '/chemical-peels'), L('SkinPen Microneedling', '/skinpen-microneedling'), L('Brow & Lash', '/brow-and-lash'), L('Skin Care Products', '/skin-care-products')] }] },
  { k: 'resources', label: 'Resources', img: WX('903d63_e208abbb61e548489e222ef57af90fdc~mv2.jpg'), eyebrow: 'Real results', title: 'Before & After Gallery', href: '/before-after-gallery', all: 'All resources', allHref: '/resources',
    cols: [{ h: 'Learn', links: [L('Before & After', '/before-after-gallery'), L('Blog', '/blog'), L('Pre & Aftercare', '/aftercare'), L('FAQ', '/faq'), L('What to Expect', '/what-to-expect')] }, { h: 'Patient care', links: [L('VIP Membership', '/membership'), L('Financing', '/financing'), L('New Patient Forms', '/new-patient-forms'), L('Gift Cards', 'https://squareup.com/gift/8CPGZKSHK7T66/order')] }] },
];

class Component extends DCLogic {
  state = { open: null, sheet: false, w: typeof window !== 'undefined' ? window.innerWidth : 1400 };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onResize);
    if (this.props.startOpen) this.setState({ open: this.props.startOpen });
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); document.body.style.overflow = ''; }
  navBottom() {
    const el = typeof document !== 'undefined' && document.querySelector('img[alt="Avere Beauty"]');
    const bar = el && el.closest('a') && el.closest('a').parentElement;
    return bar ? Math.max(0, Math.round(bar.getBoundingClientRect().bottom)) : 100;
  }
  renderVals() {
    const { open, sheet, w } = this.state;
    const desktop = w >= 1080;
    const active = this.props.active ?? '';
    const panel = desktop && MENU.find(m => m.k === open);
    return {
      isDesktop: desktop, isMobile: !desktop,
      closeAll: () => desktop && this.setState({ open: null }),
      items: MENU.map(m => {
        const on = open === m.k, cur = active === m.k;
        return {
          ...m, isOpen: on, caret: on ? '▲' : '▼', plus: on ? '−' : '+',
          open: () => desktop && this.setState({ open: m.k }),
          toggle: () => this.setState({ open: on ? null : m.k }),
          style: { display: 'flex', alignItems: 'center', gap: 6, padding: '10px 16px', borderRadius: 999, border: 'none', cursor: 'pointer', fontFamily: "'Lato',sans-serif", fontSize: 15, fontWeight: 500, whiteSpace: 'nowrap', background: on ? '#FFE3E3' : 'transparent', color: cur ? '#B04A62' : '#2B2226', transition: 'background .15s' },
        };
      }),
      hasPanel: !!panel, panel: panel || MENU[0],
      sheetOpen: !desktop && sheet, sheet, sheetIcon: sheet ? '✕' : '☰', sheetWord: sheet ? 'Close' : 'Menu', sheetLabel: sheet ? 'Close menu' : 'Open menu',
      sheetTop: this.navBottom() + 'px',
      promoText: desktop ? 'New patients receive 10% off their first treatment' : '10% off your first treatment',
      barPad: desktop ? '10px 32px' : '8px 16px', barH: desktop ? '72px' : '64px', logoH: desktop ? '56px' : '44px',
      toggleSheet: () => {
        const next = !sheet;
        document.body.style.overflow = next ? 'hidden' : '';
        this.setState({ sheet: next, open: null });
      },
    };
  }
}
</script>
</body>
</html>
